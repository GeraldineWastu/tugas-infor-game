<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Number Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Memory Card Number Game</h1>
            <div class="game-info">
                <div class="info-item">
                    <span class="label">Skor:</span>
                    <span class="value" id="score">0</span>
                </div>
                <div class="info-item">
                    <span class="label">Pasangan Ditemukan:</span>
                    <span class="value" id="pairs-found">0</span>
                </div>
                <div class="info-item">
                    <span class="label">Total Pasangan:</span>
                    <span class="value" id="total-pairs">8</span>
                </div>
            </div>
        </div>

        <div class="game-board" id="game-board">
            <!-- Kartu akan dibuat secara dinamis dengan JavaScript -->
        </div>

        <div class="button-group">
            <button class="btn" id="new-game-btn">Permainan Baru</button>
            <button class="btn btn-secondary" id="reset-btn">Reset</button>
        </div>

        <div class="game-status" id="game-status"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
